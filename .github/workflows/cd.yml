name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'eimps-fe/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./eimps-fe
        run: npm install

      - name: Build Application
        working-directory: ./eimps-fe
        run: npm run build
        # Passing the production environment variable from GitHub Secrets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Based on your S3 bucket region

      - name: Deploy to S3
        working-directory: ./eimps-fe
        # Syncs the dist folder to the S3 bucket, deleting files in the bucket that are not in the dist folder
        run: aws s3 sync dist/ s3://eimps-frontend-prod --delete
